name: Test bookstore SQLite extension

on:
  push:
    paths:
      - 'Databases/bookstore-database-application/**'
      - '.github/workflows/test-bookstore.yml'
  pull_request:
    paths:
      - 'Databases/bookstore-database-application/**'
      - '.github/workflows/test-bookstore.yml'
  workflow_dispatch:

jobs:
  test-bookstore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run SQLite unit tests
        run: python -m unittest discover -s Databases/bookstore-database-application/tests -p 'test_*.py' -v
