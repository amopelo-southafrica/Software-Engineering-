name: Build research paper PDFs
on:
  push:
    paths:
      - '**/RESEARCH_PAPER.md'
      - '.github/scripts/render_research.py'
      - '.github/workflows/build-research-papers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install document dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-inter libpango-1.0-0 libpangocairo-1.0-0
          python -m pip install --user markdown2 beautifulsoup4 weasyprint
      - name: Render PDF manuscripts
        run: python .github/scripts/render_research.py
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -name RESEARCH_PAPER.pdf -print0 | xargs -0 -r git add
          if ! git diff --cached --quiet; then
            git commit -m "Render formal research paper PDFs without cover dates"
            git push
          fi
