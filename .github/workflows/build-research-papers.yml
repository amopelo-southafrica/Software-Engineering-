name: Build research paper PDFs
on:
  push:
    paths:
      - '**/RESEARCH_PAPER.md'
      - '.github/scripts/render_research.py'
      - '.github/workflows/build-research-papers.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-papers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install document dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-inter libpango-1.0-0 libpangocairo-1.0-0
          python -m pip install --user markdown2 beautifulsoup4 weasyprint pypdf
      - name: Render PDF manuscripts
        run: python .github/scripts/render_research.py
      - name: Check paper length and pages
        run: python .github/scripts/verify_research_papers.py
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -name RESEARCH_PAPER.pdf -print0 | xargs -0 -r git add
          if ! git diff --cached --quiet; then
            git commit -m "Render formal research paper PDFs without cover dates"
            # A project upload may land while rendering. Rebase our PDF-only
            # commit over the newer repository head rather than force-pushing.
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              git fetch origin "${GITHUB_REF_NAME}"
              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                git rebase --abort
                echo "PDF update conflicts with a newer commit; refusing to overwrite."
                exit 1
              fi
              sleep 2
            done
            echo "PDF push failed after 5 non-destructive retries"
            exit 1
          fi
