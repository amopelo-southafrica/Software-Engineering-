<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460"><rect width="800" height="460" fill="#fff"/><g font-family="Inter,Arial,sans-serif" fill="#111"><text x="400" y="28" font-size="17" text-anchor="middle" font-weight="600">Key source-code defects and verified remediation</text><text x="34" y="67" font-size="12" font-weight="600">Original source behaviour</text><text x="435" y="67" font-size="12" font-weight="600">Supplementary implementation</text><line x1="25" y1="81" x2="775" y2="81" stroke="#ddd"/><text x="34" y="110" font-size="12">Delete lacks an explicit commit</text><text x="435" y="110" font-size="12">Transaction commits; persistence test</text><line x1="25" y1="131" x2="775" y2="131" stroke="#eee"/><text x="34" y="160" font-size="12">Search executes query but prints no results</text><text x="435" y="160" font-size="12">Search returns and displays matching records</text><line x1="25" y1="181" x2="775" y2="181" stroke="#eee"/><text x="34" y="210" font-size="12">New book can omit authorID</text><text x="435" y="210" font-size="12">NOT NULL foreign key, enforced by SQLite</text><line x1="25" y1="231" x2="775" y2="231" stroke="#eee"/><text x="34" y="260" font-size="12">Author update uses nonexistent book.author</text><text x="435" y="260" font-size="12">Update author rows through author.id</text><line x1="25" y1="281" x2="775" y2="281" stroke="#eee"/><text x="34" y="310" font-size="12">Single top-level action per run</text><text x="435" y="310" font-size="12">Repeat until user exits the menu</text><line x1="25" y1="331" x2="775" y2="331" stroke="#eee"/><text x="34" y="360" font-size="12">No stock quantity constraint</text><text x="435" y="360" font-size="12">Nonnegative validation and SQL CHECK</text><line x1="25" y1="381" x2="775" y2="381" stroke="#eee"/><text x="400" y="429" text-anchor="middle" font-size="12">10 automated unit tests passed on GitHub Actions</text><text x="400" y="448" text-anchor="middle" font-size="11">The 