<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480"><rect width="780" height="480" fill="white"/><g font-family="Inter,Arial,sans-serif" fill="#111"><text x="390" y="28" text-anchor="middle" font-size="17" font-weight="600">Verified supplementary bookstore: separation of responsibilities</text><rect x="275" y="50" width="230" height="50" rx="4" fill="#f4f7f9" stroke="#355D79"/><text x="390" y="71" font-size="13" font-weight="600" text-anchor="middle">User</text><text x="390" y="88" font-size="11.5" text-anchor="middle">Menu-driven CLI</text><line x1="390" y1="100" x2="390" y2="124" stroke="#355D79" stroke-width="2"/><path d="M385 118 L390 126 L395 118" stroke="#355D79" stroke-width="1.5" fill="none"/><rect x="230" y="130" width="320" height="56" rx="4" fill="#fff" stroke="#355D79"/><text x="390" y="153" font-size="14" font-weight="600" text-anchor="middle">run_menu()</text><text x="390" y="173" text-anchor="middle" font-size="11.5">Routes input; displays results and errors</text><line x1="390" y1="186" x2="390" y2="212" stroke="#355D79" stroke-width="2"/><path d="M385 206 L390 214 L395 206" stroke="#355D79" stroke-width="1.5" fill="none"/><rect x="135" y="218" width="510" height="74" rx="4" fill="#f4f7f9" stroke="#355D79"/><text x="390" y="239" text-anchor="middle" font-size="14" font-weight="600">Testable application functions</text><text x="390" y="260" text-anchor="middle" font-size="11.5">add_book / update_book / delete_book / search_books</text><text x="390" y="278" text-anchor="middle" font-size="11.5">update_author / list_books / input validation</text><line x1="390" y1="292" x2="390" y2="318" stroke="#355D79" stroke-width="2"/><path d="M385 312 L390 320 L395 312" stroke="#355D79" stroke-width="1.5" fill="none"/><rect x="150" y="323" width="480" height="50" rx="4" fill="#fff" stroke="#355D79"/><text x="390" y="344" font-size="14" font-weight="600" text-anchor="middle">sqlite3 parameterised statements + transactions</text><text x="390" y="360" font-size="11.5" text-anchor="middle">COMMIT on success; ROLLBACK on failure</text><line x1="390" y1="373" x2="390" y2="400" stroke="#355D79" stroke-width="2"/><path d="M385 394 L390 402 L395 394" stroke="#355D79" stroke-width="1.5" fill="none"/><rect x="132" y="406" width="240" height="54" rx="4" fill="#e9eef2" stroke="#355D79"/><text x="252" y="428" text-anchor="middle" font-size="13" font-weight="600">author</text><text x="252" y="446" text-anchor="middle" font-size="11.5">id (PK), name, country</text><rect x="408" y="406" width="240" height="54" rx="4" fill="#e9eef2" stroke="#355D79"/><text x="528" y="428" text-anchor="middle" font-size="13" font-weight="600">book</text><text x="528" y="446" text-anchor="middle" font-size="11.5">id (PK), title, authorID (FK), qty</text><line x1="408" y1="434" x2="372" y2="434" stroke="#355D79" stroke-width="1.5" stroke-dasharray="5 3"/><path d="M379 429 L372 434 L379 439" stroke="#355D79" stroke-width="1.5" fill="none"/></g></svg>